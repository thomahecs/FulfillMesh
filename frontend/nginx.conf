server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth { proxy_pass http://order-service:8081; }
    location /api/orders { proxy_pass http://order-service:8081; }
    location /api/inventory { proxy_pass http://inventory-service:8082; }
    location /api/fulfillments { proxy_pass http://fulfillment-service:8083; }
    location /api/shipments { proxy_pass http://shipping-service:8084; }

    location = /health/order { proxy_pass http://order-service:8081/actuator/health; }
    location = /health/inventory { proxy_pass http://inventory-service:8082/actuator/health; }
    location = /health/fulfillment { proxy_pass http://fulfillment-service:8083/actuator/health; }
    location = /health/shipping { proxy_pass http://shipping-service:8084/actuator/health; }

    location / { try_files $uri $uri/ /index.html; }
}
